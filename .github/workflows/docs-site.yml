name: Docs site

on:
  push:
    branches: [main]
    paths:
      - docs-site/**
      - docs/privacy-policy.md
      - .github/workflows/docs-site.yml
  pull_request:
    branches: [main]
    paths:
      - docs-site/**
      - docs/privacy-policy.md
      - .github/workflows/docs-site.yml
  workflow_dispatch:

concurrency:
  group: docs-site-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs-site

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm from the site's packageManager field
        uses: pnpm/action-setup@v6
        with:
          package_json_file: docs-site/package.json

      - name: Setup Node.js with the site's pnpm store cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Install site dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Type-check and validate Astro files
        run: pnpm check

      - name: Build the static site
        run: pnpm build

      - name: Check internal links, anchors and required store listing pages
        run: pnpm check:links --require /privacy/ --require /support/ --require /how-it-works/ --require /faq/

      - name: Upload the built site as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy the artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
